
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subfinderhunter"
version = "1.0.0"
description = "Passive subdomain discovery CLI"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "dnspython"
]

[project.scripts]
subf = "subf:main"

[tool.setuptools]
py-modules = [
    "subf",
    "sources",
    "resolver",
    "exporter"
]
